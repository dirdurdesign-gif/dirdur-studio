:root{
  --yellow:#FCF23A; --pink:#F52EA2; --magenta:#DA238D; --purple:#671A74; --deep:#3E0F4A; --lav:#F3E6F7;
  --bg:#FFFFFF; --ink:var(--deep);
  --grad:linear-gradient(160deg,var(--pink) 0%,var(--magenta) 38%,var(--purple) 100%);
  --font:"Narkiss Block","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#FFFFFF; --ink:#3E0F4A; } }
:root[data-theme="dark"]{ --bg:#FFFFFF; --ink:#3E0F4A; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:14px}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:104px;overflow-x:hidden}
/* header */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}
.mark{display:flex;align-items:center;gap:10px}
.mark img{height:50px;width:auto;display:block}
.mark span{font-weight:900;font-size:22px;color:var(--purple);line-height:1;margin-top:10px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--purple);color:var(--yellow)}
.icon-btn svg{width:20px;height:20px}

/* hero carousel */
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 0;scrollbar-width:none}
.hero::-webkit-scrollbar{display:none}
.hslide{flex:0 0 calc(100% - 36px);margin:0 18px;scroll-snap-align:center;position:relative;border-radius:26px;overflow:hidden;background:var(--purple);color:#fff;text-align:right}
.hslide .img{position:relative;aspect-ratio:3/4;background-size:cover;background-repeat:no-repeat}
.hslide .body{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px}
.hslide .meta{flex:1;min-width:0;font-size:13px;opacity:.9;line-height:1.3}
.hslide .meta b{display:block;font-weight:900;font-size:17px;line-height:1.1;color:var(--yellow);opacity:1;margin-bottom:2px}
.newtag{position:absolute;z-index:2;top:12px;left:12px;background:var(--yellow);color:var(--purple);font-weight:900;font-size:14px;padding:4px 12px;border-radius:999px}
.hslide .row-btns{flex:none}
.hslide .btn{height:44px;font-size:16px;padding:0 14px}
.hslide .btn-yellow{flex:none}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0 18px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(103,26,116,.3);transition:width .2s;cursor:pointer}
.dots i.on{width:22px;border-radius:4px;background:var(--purple)}

/* bell + notifications */
.bell{position:relative}
.bell .cnt{position:absolute;top:-3px;left:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.bell .cnt[hidden]{display:none}
.notifs h3{font-weight:900;font-size:26px;color:var(--purple);margin:0 0 14px}
.nitem{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:10px;border-radius:18px}
.nitem + .nitem{margin-top:6px}
.nitem.unread{background:var(--lav)}
.nitem .nimg{width:56px;height:56px;flex:none;border-radius:14px;background:var(--grad);background-size:cover;background-position:center}
.nitem b{display:block;font-weight:900;font-size:16px;color:var(--deep);margin-bottom:2px}
.nitem span{font-size:14px;color:var(--purple);opacity:.8;line-height:1.4}
.nitem .when{margin-inline-start:auto;font-size:12px;color:var(--purple);opacity:.6;align-self:flex-start;white-space:nowrap}

.row-btns{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-weight:900;font-size:18px}
.btn svg{width:18px;height:18px}
.btn-yellow{background:var(--yellow);color:var(--purple);flex:1}
.btn-glass{background:rgba(255,255,255,.2);color:#fff}
.btn-purple{background:var(--purple);color:var(--yellow);flex:1}
.btn-line{background:var(--lav);color:var(--purple)}

/* sections */
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 18px 12px}
.sec-h h3{margin:0;font-weight:900;font-size:24px;line-height:1;color:var(--purple)}
.sec-h img{height:52px;width:auto}
.sec-h button{font-weight:700;font-size:15px;color:var(--purple);background:rgba(103,26,116,.1);padding:7px 14px;border-radius:999px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.ep-card{flex:0 0 36%;scroll-snap-align:start;text-align:right}
.thumb{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--grad)}
.thumb.img{background-color:var(--purple);background-position:center;background-size:cover;background-repeat:no-repeat}
.thumb .n{position:absolute;inset:auto 12px 10px 12px;font-weight:900;font-size:34px;line-height:.9;color:var(--yellow)}
.thumb .n small{display:block;font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.thumb .play{position:absolute;bottom:10px;left:10px;width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.thumb .play svg{width:16px;height:16px;margin-left:-2px}
.thumb .tag{position:absolute;top:10px;right:10px;background:var(--yellow);color:var(--purple);font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px}
.ep-card .cap{margin-top:9px;font-size:13px;color:var(--purple);opacity:.75}
.ep-card .cap b{display:block;font-weight:900;font-size:16px;opacity:1;color:var(--deep);margin-bottom:2px}
.cont .bar{height:6px;border-radius:3px;background:rgba(103,26,116,.15);margin-top:8px;overflow:hidden}
.cont .bar i{display:block;height:100%;background:var(--pink)}

.soon{margin:0 18px;border-radius:30px;background:var(--grad);color:#fff;padding:22px;display:flex;gap:16px;align-items:center;overflow:hidden;width:calc(100% - 36px);text-align:right}
.soon img{width:42%;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.soon .tagy{display:inline-block;background:var(--yellow);color:var(--purple);font-weight:900;font-size:14px;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.soon b{display:block;font-weight:900;font-size:24px;line-height:1.05;color:var(--yellow);margin-bottom:6px}
.soon span{font-size:15px;line-height:1.45}

/* views */
.view[hidden]{display:none}
.page-h{font-weight:900;font-size:36px;color:var(--purple);margin:4px 18px 16px}
.search-box{margin:0 18px 22px;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-radius:999px;background:var(--lav);color:var(--purple)}
.search-box input{flex:1;background:none;border:0;color:var(--deep);font:inherit;font-size:17px;outline:none}
.search-box input::placeholder{color:rgba(62,15,74,.45)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}
.scard{text-align:right}
.scard .pimg{aspect-ratio:2/3;border-radius:22px;background-color:var(--purple);background-image:var(--grad);background-position:center top;background-size:cover;background-repeat:no-repeat;position:relative;overflow:hidden}
.scard .pimg img{position:absolute;inset:auto 10% 10% 10%;width:80%}
.scard b{display:block;font-weight:900;font-size:18px;margin-top:9px;color:var(--deep)}
.scard span{font-size:13px;color:var(--purple);opacity:.75}
.empty{margin:20px 18px;padding:26px;text-align:center;line-height:1.55;background:var(--lav);border-radius:26px;color:var(--purple)}
.empty strong{display:block;font-weight:900;font-size:22px;margin-bottom:4px;color:var(--deep)}

/* bottom nav */
.tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:470px;z-index:30;display:flex;justify-content:space-around;background:var(--purple);border-radius:999px;padding:8px;box-shadow:0 10px 30px rgba(62,15,74,.35)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;padding:6px 0;border-radius:999px;color:rgba(255,255,255,.75)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--purple);background:var(--yellow)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(62,15,74,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:#fff;color:var(--deep);border-radius:32px 32px 0 0;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:12px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.grab{width:46px;height:5px;border-radius:3px;background:rgba(103,26,116,.25);margin:0 auto 18px}
.sh-head{display:flex;gap:16px;margin-bottom:16px;align-items:center}
.sh-head .pimg{width:108px;flex:none;aspect-ratio:2/3;border-radius:18px;background-color:var(--purple);background-position:center top;background-size:cover;background-repeat:no-repeat}
.sh-head img.lg{max-width:170px;height:auto;display:block;margin-bottom:8px}
.sh-head h3{font-weight:900;font-size:34px;line-height:1;margin:0 0 8px;color:var(--purple)}
.sh-head p{margin:0;font-size:14px;line-height:1.5;color:var(--purple);opacity:.8}
.sh-line{font-size:17px;line-height:1.55;margin:0 0 18px}
.eps-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.eps-h b{font-weight:900;font-size:23px;color:var(--purple)}
.eps-h span{font-size:14px;color:var(--purple);opacity:.7}
.eps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ep{aspect-ratio:1;border-radius:18px;background:var(--lav);color:var(--purple);font-weight:900;font-size:21px}
.ep.seen{opacity:.55}
.ep.has-video{background:var(--grad);color:#fff;opacity:1}
.ep.cur{background:var(--yellow);color:var(--purple);opacity:1;box-shadow:inset 0 0 0 3px var(--purple)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;display:none}
.player.on{display:block}
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;max-width:520px;margin:0 auto}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
@media (max-aspect-ratio: 10/16){.slide video{object-fit:cover}}
.slide.ph{background:var(--grad)}
.slide .msg{position:absolute;inset:0 0 30% 0;display:grid;place-items:center;text-align:center;padding:0 30px 0 90px;z-index:2;color:#fff}
.slide .msg b{display:block;font-weight:900;font-size:72px;line-height:.9;color:var(--yellow);margin-bottom:12px}
.slide .msg span{font-size:17px;line-height:1.5;max-width:24ch;display:block;margin:0 auto}
.paused{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s}
.paused.on{opacity:1}
.paused i{width:86px;height:86px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.paused svg{width:36px;height:36px;margin-left:-4px}
.p-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px;max-width:520px;margin:0 auto;pointer-events:none}
.p-top > *{pointer-events:auto}
.p-top .icon-btn{background:var(--yellow);color:var(--purple)}
.p-top .ttl{font-weight:900;font-size:17px;background:var(--purple);color:var(--yellow);border-radius:999px;padding:9px 16px}
.side{position:absolute;left:14px;bottom:calc(166px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.side button i{width:52px;height:52px;border-radius:50%;background:rgba(103,26,116,.85);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.side svg{width:24px;height:24px}
.side .liked i{background:var(--pink)}
.side .saved i{background:var(--yellow);color:var(--purple)}
.info{position:absolute;right:16px;left:86px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:5;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.info h4{font-weight:900;font-size:30px;line-height:1;margin:0 0 8px;color:var(--yellow)}
.info .epno{display:inline-block;font-weight:900;font-size:15px;margin-bottom:8px;background:var(--pink);color:#fff;border-radius:999px;padding:4px 13px;text-shadow:none}
.info p{margin:0;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info p.open{-webkit-line-clamp:unset}
.p-bottom{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.p-bottom::before{content:"";position:absolute;inset:-200px 0 0 0;background:linear-gradient(transparent,rgba(62,15,74,.7));z-index:-1;pointer-events:none}
.prog{height:18px;display:flex;align-items:center;cursor:pointer;margin-bottom:6px}
.prog i{display:block;height:6px;width:100%;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--yellow)}
.allbar{display:flex;align-items:center;justify-content:space-between;width:100%;height:54px;padding:0 20px;border-radius:999px;background:var(--yellow);color:var(--purple);font-weight:900;font-size:18px}
.allbar svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--purple);color:var(--yellow);font-weight:900;font-size:16px;padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* intro: flat colour wipes */
.intro{position:fixed;inset:0;z-index:200;overflow:hidden;cursor:pointer}
.intro.gone{display:none}
.ipw{position:absolute;inset:0;z-index:var(--n);overflow:hidden}
.ip{position:absolute;inset:0;background:var(--c)}
.ip.wipe{transform:translateX(102%);animation:iwipe .28s cubic-bezier(.7,0,.2,1) calc(.05s + (var(--n) - 1) * .11s) forwards}
.ilayer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.ilogo{width:min(68vw,300px);display:block;animation:istamp .5s cubic-bezier(.2,1.25,.4,1) .82s both}
.itag{background:var(--purple);color:var(--yellow);font-weight:900;font-size:28px;line-height:1;padding:9px 24px 7px;border-radius:999px;animation:iup .45s cubic-bezier(.34,1.56,.64,1) 1.1s both}
@keyframes iwipe{to{transform:translateX(0)}}
@keyframes istamp{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}
@keyframes iup{from{transform:translateY(24px) scale(.8);opacity:0}to{transform:none;opacity:1}}
/* exit: only the last colour lifts away, fast */
.intro.out .ipw:not(.ilast){visibility:hidden}
.intro.out .ilayer,.intro.out .ipw.ilast{transition:transform .36s cubic-bezier(.7,0,.25,1);transform:translateY(-102%)}
@media (prefers-reduced-motion: reduce){
  .intro *{animation:none!important}
  .ip.wipe{display:none}
  .intro.out .ilayer,.intro.out .ipw.ilast{transform:none;transition:none}
  .intro.out{opacity:0;transition:opacity .3s}
}

/* sponsor */
.sponsor{display:flex;align-items:center;gap:14px;margin:0 18px 30px;padding:16px;border-radius:22px;background:#00F2F1;color:#000}
.sp-logo{width:64px;height:64px;flex:none;border-radius:16px;border:2px dashed rgba(0,0,0,.35);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;line-height:1.2}
.sp-lab{display:inline-block;font-size:12px;font-weight:700;background:#000;color:#00F2F1;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.sponsor b{display:block;font-weight:900;font-size:21px;line-height:1.05}
.sp-txt{display:block;font-size:14px;margin-top:3px}

/* up next */
.upnext{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(62,15,74,.88);backdrop-filter:blur(6px);color:#fff;text-align:center;padding:0 28px}
.un-in{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:330px}
.un-lab{font-weight:900;font-size:22px}
.un-ring{position:relative;width:96px;height:96px}
.un-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.un-ring circle{fill:none;stroke:rgba(255,255,255,.2);stroke-width:8}
.un-ring .arc{stroke:var(--yellow);stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:0;animation:unring 3s linear forwards}
.un-ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:46px;color:var(--yellow)}
@keyframes unring{to{stroke-dashoffset:276.5}}
.un-card{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:rgba(255,255,255,.12);border-radius:18px;padding:10px}
.un-thumb{width:64px;aspect-ratio:4/5;flex:none;border-radius:12px;background:var(--grad);background-size:cover;background-position:center;display:grid;place-items:center}
.un-thumb span{font-weight:900;font-size:14px;color:var(--yellow)}
.un-card b{display:block;font-weight:900;font-size:18px;line-height:1.1;color:var(--yellow)}
.un-card span{font-size:14px;opacity:.85}
.upnext .row-btns{width:100%}
.upnext .btn{height:48px;font-size:17px}
.upnext .btn-yellow{flex:1}
.un-sp{font-size:13px;opacity:.75}
.p-top{z-index:8}
@media (prefers-reduced-motion: reduce){.un-ring .arc{animation:none}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <span class="ipw" style="--n:0"><i class="ip" style="--c:#FFE200"></i></span><span class="ipw" style="--n:1"><i class="ip wipe" style="--c:#FF0000"></i></span><span class="ipw" style="--n:2"><i class="ip wipe" style="--c:#00F2F1"></i></span><span class="ipw" style="--n:3"><i class="ip wipe" style="--c:#1AD81B"></i></span><span class="ipw" style="--n:4"><i class="ip wipe" style="--c:#00ABF3"></i></span><span class="ipw" style="--n:5"><i class="ip wipe" style="--c:#FF3FD0"></i></span><span class="ipw ilast" style="--n:6"><i class="ip wipe" style="--c:#FFE200"></i></span>
  <div class="ilayer"><img class="ilogo" src="img/intro-logo.png" alt=""><span class="itag">שורטס</span></div>
</div>
<div class="app">
  <header class="appbar">
    <div class="mark"><img src="img/intro-logo.png" alt="ישראל בידור"><span>שורטס</span></div>
    <button class="icon-btn bell" id="bell" aria-label="התראות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><span class="cnt" id="bell-cnt" hidden></span></button>
  </header>
  <main id="v-home" class="view"></main>
  <main id="v-search" class="view" hidden>
    <h1 class="page-h">מה רואים היום?</h1>
    <label class="search-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="שם של סדרה או של פרק" autocomplete="off"></label>
    <div id="search-out"></div>
  </main>
  <main id="v-list" class="view" hidden>
    <h1 class="page-h">הרשימה שלי</h1>
    <div id="list-out"></div>
  </main>
  <nav class="tabs" aria-label="ניווט">
    <button class="tab" data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>בית</button>
    <button class="tab" data-go="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>חיפוש</button>
    <button class="tab" data-go="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>הרשימה שלי</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="פרטי סדרה"></section>
<section class="player" id="player" aria-label="נגן">
  <div class="feed" id="feed"></div>
  <div class="p-top">
    <button class="icon-btn" id="p-back" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="ttl" id="p-ttl"></div>
  </div>
  <div class="side">
    <button id="b-like"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></i><span id="like-n"></span></button>
    <button id="b-save"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg></i><span>לרשימה</span></button>
    <button id="b-eps"><i><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg></i><span>פרקים</span></button>
    <button id="b-share"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 4v4C7 9 4 13 3 20c2.5-3.5 6-5 11-5v4l7-7.5z"/></svg></i><span>שיתוף</span></button>
  </div>

    <div class="prog" id="prog" aria-hidden="true"><i><b id="prog-b"></b></i></div>
    <button class="allbar" id="b-all"><span id="all-txt"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
  </div>
</section>
<div class="toast" id="toast"></div>
<script>const IMG = {shPoster:"img/shPoster.jpg", shThumb:"img/shThumb.jpg", shLogo:"img/shLogo.png", myPoster:"img/myPoster.jpg", my1:"img/my1.jpg", my2:"img/my2.jpg", my3:"img/my3.jpg", my4:"img/my4.jpg", my5:"img/my5.jpg", my6:"img/my6.jpg"};
const VID = {sh6:"./israel-shidduch-6.mp4", my6:"./michal-yehuda-6.mp4"};

const SERIES = [
  {id:"israel-shidduch", title:"ישראל שידוך", season:"עונה 1", genre:"ריאליטי היכרויות", eps:12,
   poster:IMG.shPoster, logo:IMG.shLogo,
   line:"רווקה אחת, כמה מחזרים ושאלה אחת גדולה: במי הרווקה תבחר?",
   epTitles:{6:"במי אוריאן תבחר?"}, videos:{6:VID.sh6}, thumbs:{6:IMG.shThumb}},
  {id:"michal-yehuda", title:"מיכל ויהודה", genre:"דוקו", eps:6,
   poster:IMG.myPoster,
   line:"הדוקו של מיכל הקטנה ויהודה בוחבוט: החיים האישיים, הקריירה והפרידה, בפרקים של דקה.",
   epTitles:{1:"נפרדנו כך",2:"עדיין מאוהבים?",3:"הכל זה מלמעלה",4:"העניינים מתחממים",5:"ההצהרה הרשמית",6:"מיכל מצהירה"},
   videos:{6:VID.my6}, thumbs:{1:IMG.my1,2:IMG.my2,3:IMG.my3,4:IMG.my4,5:IMG.my5,6:IMG.my6}},
  {id:"israel-shidduch-2", title:"ישראל שידוך", season:"עונה 2", genre:"ריאליטי היכרויות", eps:0, soon:true, logo:IMG.shLogo,
   line:"העונה השנייה, עם שון יפישין, נמצאת בהכנה.", epTitles:{}, videos:{}, thumbs:{}}
];
const FEATURED = [{id:"michal-yehuda",ep:6,pos:"center top"},{id:"israel-shidduch",ep:6,pos:"center 22%"}];
const byId = id => SERIES.find(s=>s.id===id);
const live = SERIES.filter(s=>!s.soon);

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let progress = store.get("ibs3_progress",{});
let myList   = store.get("ibs3_list",[]);
let liked    = store.get("ibs3_liked",{});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vidOf = (s,n) => s.videos[n] || "";
const epTitle = (s,n) => s.epTitles[n] || "";
const fullTitle = s => s.title + (s.season ? " · "+s.season : "");
const PLAY = `<svg viewBox="0 0 24 24" fill="#671A74"><path d="M8 5v14l11-7z"/></svg>`;
const PLAYR = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5v14L6 12z"/></svg>`;

function thumb(s,n,tag){
  const t = s.thumbs[n]; const hasV = !!vidOf(s,n);
  return `<div class="thumb ${t?"img":""}" ${t?`style="background-image:url('${t}')"`:""}>${tag?`<span class="tag">${tag}</span>`:""}${t?(hasV?`<span class="play">${PLAY}</span>`:""):`<span class="n"><small>${esc(s.title)}</small>פרק ${n}</span>`}</div>`;
}
function epCard(s,n){
  const has = !!vidOf(s,n);
  return `<button class="ep-card" data-play="${s.id}" data-ep="${n}">${thumb(s,n,has?"חדש":"")}<div class="cap"><b>${epTitle(s,n)?esc(epTitle(s,n)):"פרק "+n}</b>${esc(s.title)} · פרק ${n}</div></button>`;
}
function sCard(s){
  return `<button class="scard" data-open="${s.id}"><div class="pimg" style="${s.poster?`background-image:url('${s.poster}')`:""}">${!s.poster&&s.logo?`<img src="${s.logo}" alt="">`:""}</div><b>${esc(s.title)}</b><span>${s.soon?s.season+" · בהכנה":(s.season?s.season+" · ":"")+s.eps+" פרקים"}</span></button>`;
}

/* ===== חסות ===== */
const SPONSOR = {name:"המותג שלכם כאן", text:"באנר חסות שכל צופה רואה בעמוד הבית"};
const SPONSOR_HTML = `<aside class="sponsor" aria-label="בחסות"><div class="sp-logo">הלוגו<br>שלכם</div><div><span class="sp-lab">בחסות</span><b>${SPONSOR.name}</b><span class="sp-txt">${SPONSOR.text}</span></div></aside>`;

/* ===== בית ===== */
function renderHome(){
  const cont = Object.entries(progress).sort((a,b)=>b[1].t-a[1].t).map(([id,p])=>({s:byId(id),p})).filter(x=>x.s&&!x.s.soon);
  const soon = SERIES.filter(s=>s.soon);
  const ordered = s => Array.from({length:s.eps},(_,i)=>i+1).sort((a,b)=>(!!vidOf(s,b)-!!vidOf(s,a))||a-b);
  $("#v-home").innerHTML = `
    <div class="hero" id="hero">${FEATURED.map(({id,ep,pos})=>{const s=byId(id); return `
      <article class="hslide">
        <div class="img" style="background-image:url('${s.poster}');background-position:${pos}"><span class="newtag">פרק ${ep} חדש</span></div>
        <div class="body">
          <div class="meta"><b>${esc(epTitle(s,ep))}</b>${esc(fullTitle(s))}</div>
          <div class="row-btns">
            <button class="btn btn-yellow" data-play="${s.id}" data-ep="${ep}" aria-label="לצפות בפרק ${ep} של ${esc(s.title)}">${PLAYR}לצפות</button>
            <button class="btn btn-glass" data-open="${s.id}">פרקים</button>
          </div>
        </div>
      </article>`;}).join("")}</div>
    <div class="dots" id="dots">${FEATURED.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>
    ${cont.length?`<section class="sec cont"><div class="sec-h"><h3>להמשיך לצפות</h3></div><div class="rail">${cont.map(({s,p})=>`<button class="ep-card" data-play="${s.id}" data-ep="${p.ep}">${thumb(s,p.ep)}<div class="cap"><b>${esc(s.title)}</b>פרק ${p.ep} מתוך ${s.eps}</div><div class="bar"><i style="width:${Math.round(p.ep/s.eps*100)}%"></i></div></button>`).join("")}</div></section>`
      :`<section class="sec"><div class="sec-h"><h3>חדש באתר</h3></div><div class="rail">${FEATURED.map(({id,ep})=>epCard(byId(id),ep)).join("")}${live.map(s=>epCard(s,1)).join("")}</div></section>`}
    ${SPONSOR_HTML}
    ${live.map(s=>`<section class="sec"><div class="sec-h">${s.logo?`<img src="${s.logo}" alt="${esc(s.title)}">`:`<h3>${esc(s.title)}</h3>`}<button data-open="${s.id}">כל ${s.eps} הפרקים</button></div><div class="rail">${ordered(s).map(n=>epCard(s,n)).join("")}</div></section>`).join("")}
    <section class="sec"><div class="sec-h"><h3>כל הסדרות</h3></div><div class="grid">${live.map(sCard).join("")}</div></section>
    ${soon.map(s=>`<section class="sec"><div class="sec-h"><h3>בקרוב</h3></div><button class="soon" data-open="${s.id}">${s.logo?`<img src="${s.logo}" alt="">`:""}<div><span class="tagy">${s.season}</span><b>${esc(s.title)} חוזרת</b><span>${esc(s.line)}</span></div></button></section>`).join("")}`;
  setupHero();
}

/* ===== קרוסלה: מתחלפת כל 7 שניות ===== */
const HERO_MS = 7000;      // auto-advance interval
const HERO_MARGIN = 18;    // matches .hslide side margin in CSS
let heroTimer = null;
function heroIndex(hero){
  const hc = hero.getBoundingClientRect(); const mid = hc.left + hc.width/2;
  let best=0, bd=Infinity;
  [...hero.children].forEach((sl,i)=>{ const r=sl.getBoundingClientRect(); const d=Math.abs(r.left+r.width/2-mid); if(d<bd){bd=d;best=i;} });
  return best;
}
function heroGo(i){
  const hero=$("#hero"); if(!hero) return;
  const sl=hero.children[i]; if(!sl) return;
  const delta = sl.getBoundingClientRect().left - hero.getBoundingClientRect().left - HERO_MARGIN;
  hero.scrollBy({left:delta, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function heroRestart(){
  clearInterval(heroTimer);
  heroTimer = setInterval(()=>{
    const hero=$("#hero");
    if(!hero || $("#v-home").hidden || $("#player").classList.contains("on") || $("#sheet").classList.contains("on") || document.hidden) return;
    heroGo((heroIndex(hero)+1) % hero.children.length);
  }, HERO_MS);
}
function setupHero(){
  const hero=$("#hero"), dots=[...document.querySelectorAll("#dots i")];
  let ticking = false;
  hero.addEventListener("scroll",()=>{
    if(ticking) return; ticking = true;
    requestAnimationFrame(()=>{ ticking = false; const i=heroIndex(hero); dots.forEach((d,k)=>d.classList.toggle("on",k===i)); });
  },{passive:true});
  ["pointerdown","touchstart","wheel"].forEach(ev=>hero.addEventListener(ev,heroRestart,{passive:true}));
  dots.forEach((d,k)=>d.addEventListener("click",()=>{ heroGo(k); heroRestart(); }));
  heroRestart();
}

/* ===== התראות ===== */
const NOTIFS = [
  {id:"n1", series:"israel-shidduch", ep:6, title:"פרק חדש: במי אוריאן תבחר?", text:"פרק 6 של ישראל שידוך כבר באתר", when:"היום"},
  {id:"n2", series:"michal-yehuda", ep:6, title:"פרק חדש: מיכל מצהירה", text:"פרק 6 של מיכל ויהודה כבר באתר", when:"היום"},
  {id:"n3", series:"israel-shidduch-2", title:"ישראל שידוך חוזרת", text:"עונה 2 עם שון יפישין בדרך. נעדכן כשהפרק הראשון יעלה", when:"השבוע"}
];
let readN = store.get("ibs3_read",[]);
function renderBell(){
  const n = NOTIFS.filter(x=>!readN.includes(x.id)).length;
  const c = $("#bell-cnt"); c.textContent = n; c.hidden = !n;
  $("#bell").setAttribute("aria-label", n ? `התראות, ${n} חדשות` : "התראות");
}
function openNotifs(){
  $("#sheet").innerHTML = `<div class="grab"></div><div class="notifs"><h3>התראות</h3>${NOTIFS.map(x=>{const s=byId(x.series); const img=(x.ep&&s.thumbs[x.ep])||s.poster||"";
    return `<button class="nitem ${readN.includes(x.id)?"":"unread"}" ${x.ep?`data-play="${s.id}" data-ep="${x.ep}"`:`data-open="${s.id}"`}><div class="nimg" ${img?`style="background-image:url('${img}')"`:""}></div><div><b>${esc(x.title)}</b><span>${esc(x.text)}</span></div><span class="when">${x.when}</span></button>`;}).join("")}</div>`;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop=0;
  readN = NOTIFS.map(x=>x.id); store.set("ibs3_read",readN); renderBell();
}

/* ===== חיפוש / רשימה ===== */
function renderSearch(){
  const q = $("#q").value.trim();
  const res = q ? SERIES.filter(s=>(s.title+" "+s.genre+" "+s.line+" "+Object.values(s.epTitles).join(" ")).includes(q)) : SERIES;
  $("#search-out").innerHTML = res.length ? `<div class="grid">${res.map(sCard).join("")}</div>`
    : `<div class="empty"><strong>לא מצאנו את "${esc(q)}"</strong>אפשר לחפש לפי שם הסדרה או שם של פרק.</div>`;
}
function renderList(){
  const items = myList.map(byId).filter(Boolean);
  $("#list-out").innerHTML = items.length ? `<div class="grid">${items.map(sCard).join("")}</div>`
    : `<div class="empty"><strong>הרשימה עדיין ריקה</strong>לוחצים על "לרשימה" בסדרה, והיא תחכה לכם כאן.</div>`;
}
function go(view){
  ["home","search","list"].forEach(v=>$("#v-"+v).hidden = v!==view);
  document.querySelectorAll(".tab").forEach(t=>{ if(t.dataset.go===view) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
  if(view==="home") renderHome();
  if(view==="search"){ renderSearch(); setTimeout(()=>$("#q").focus(),50); }
  if(view==="list") renderList();
  window.scrollTo(0,0);
}

/* ===== גיליון סדרה ===== */
function openSheet(id, fromPlayer=false){
  const s = byId(id);
  const p = progress[id]; const seen = new Set(p?p.seen:[]);
  const cur = fromPlayer ? player.ep : (p?p.ep:0);
  const inList = myList.includes(id);
  const firstVid = +Object.keys(s.videos)[0] || 1;
  const startEp = p ? p.ep : firstVid;
  $("#sheet").innerHTML = `
    <div class="grab"></div>
    ${fromPlayer?"":`<div class="sh-head">${s.poster?`<div class="pimg" style="background-image:url('${s.poster}')"></div>`:""}<div>${s.logo?`<img class="lg" src="${s.logo}" alt="${esc(s.title)}">`:`<h3>${esc(s.title)}</h3>`}<p>${s.season?s.season+" · ":""}${s.genre}${s.soon?" · בהכנה":" · "+s.eps+" פרקים · כדקה לפרק"}</p></div></div>
    <p class="sh-line">${esc(s.line)}</p>
    <div class="row-btns">
      ${s.soon?"":`<button class="btn btn-purple" data-play="${id}" data-ep="${startEp}">${PLAYR}${p?"להמשיך מפרק "+p.ep:"לצפות בפרק "+startEp}</button>`}
      <button class="btn btn-line" data-toggle-list="${id}" ${s.soon?'style="flex:1"':""}>${inList?"ברשימה שלי":"לרשימה"}</button>
    </div>`}
    ${s.soon?`<div class="empty" style="background:var(--lav);margin:20px 0 0"><strong>העונה בהכנה</strong>הפרקים יופיעו כאן ברגע שיעלו.</div>`:`
    <div class="eps-h"><b>${fromPlayer?esc(s.title)+" · ":""}כל הפרקים</b><span>${s.eps} פרקים</span></div>
    <div class="eps">${Array.from({length:s.eps},(_,i)=>i+1).map(n=>`<button class="ep${n===cur?" cur":""}${seen.has(n)&&n!==cur?" seen":""}${vidOf(s,n)?" has-video":""}" data-play="${id}" data-ep="${n}" aria-label="פרק ${n}${epTitle(s,n)?" "+esc(epTitle(s,n)):""}">${n}</button>`).join("")}</div>`}`;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  $("#sheet").scrollTop = 0;
}
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
function toggleList(id){
  if(myList.includes(id)){ myList = myList.filter(x=>x!==id); toast("הוסר מהרשימה"); }
  else { myList.unshift(id); toast("נוסף לרשימה"); }
  store.set("ibs3_list",myList);
}

/* ===== נגן ===== */
const player = {id:null, ep:1, obs:null, upTimer:null};
function slideHTML(s,n){
  const pausedEl = `<div class="paused"><i>${PLAY}</i></div>`;
  const v = vidOf(s,n);
  if(v) return `<div class="slide" data-ep="${n}"><video src="${v}" poster="${s.thumbs[n]||""}" playsinline preload="auto"></video>${pausedEl}</div>`;
  return `<div class="slide ph" data-ep="${n}"><div class="msg"><div><b>פרק ${n}</b><span>הפרק הזה עוד לא עלה לאתר. גוללים כדי לעבור לפרק אחר.</span></div></div>${pausedEl}</div>`;
}
function openPlayer(id, ep=1){
  closeSheet(); cancelUpNext();
  const s = byId(id); if(!s || s.soon) return;
  player.id=id; player.ep=ep;
  const feed = $("#feed");
  feed.innerHTML = Array.from({length:s.eps},(_,i)=>slideHTML(s,i+1)).join("");
  $("#player").classList.add("on"); document.body.style.overflow="hidden";
  $("#i-title").textContent = s.title; $("#i-line").textContent = s.line; $("#i-line").classList.remove("open");
  $("#p-ttl").textContent = fullTitle(s);
  feed.scrollTop = (ep-1)*feed.clientHeight;
  if(player.obs) player.obs.disconnect();
  player.obs = new IntersectionObserver(es=>{
    es.forEach(e=>{
      const v = e.target.querySelector("video");
      if(e.isIntersecting && e.intersectionRatio>.6){ setEp(+e.target.dataset.ep); if(v){ v.currentTime=0; v.play().catch(()=>{ e.target.querySelector(".paused").classList.add("on"); }); } }
      else if(v){ v.pause(); }
    });
  },{root:feed,threshold:[.6]});
  feed.querySelectorAll(".slide").forEach(sl=>player.obs.observe(sl));
  feed.querySelectorAll("video").forEach(v=>{
    v.addEventListener("timeupdate",()=>{ if(+v.closest(".slide").dataset.ep===player.ep) $("#prog-b").style.width=(v.currentTime/(v.duration||1)*100)+"%"; });
    v.addEventListener("play",()=>v.closest(".slide").querySelector(".paused").classList.remove("on"));
    v.addEventListener("ended",()=>showUpNext(v.closest(".slide"), s, +v.closest(".slide").dataset.ep));
  });
  setEp(ep);
  const first = feed.querySelector(`.slide[data-ep="${ep}"] video`);
  if(first) first.play().catch(()=>{});
}
/* ===== הפרק הבא בעוד 3, 2, 1 ===== */
const UPNEXT_SECONDS = 3;
function nextOf(s,n){
  if(n < s.eps) return {s, n:n+1, label:"הפרק הבא"};
  const other = live.find(x=>x.id!==s.id && Object.keys(x.videos).length);
  return other ? {s:other, n:+Object.keys(other.videos)[0], label:"הסדרה הבאה"} : null;
}
function cancelUpNext(){
  clearInterval(player.upTimer); player.upTimer = null;
  document.querySelectorAll(".upnext").forEach(el=>el.remove());
}
function goNext(nx){
  cancelUpNext();
  if(nx.s.id===player.id) $("#feed").scrollTo({top:(nx.n-1)*$("#feed").clientHeight, behavior:"smooth"});
  else openPlayer(nx.s.id, nx.n);
}
function showUpNext(slide, s, n){
  const nx = nextOf(s,n); if(!nx) return;
  cancelUpNext();
  const t = nx.s.thumbs[nx.n];
  const el = document.createElement("div");
  el.className = "upnext";
  el.innerHTML = `<div class="un-in">
      <span class="un-lab">${nx.label} בעוד</span>
      <div class="un-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44"/></svg><b>${UPNEXT_SECONDS}</b></div>
      <div class="un-card"><div class="un-thumb" ${t?`style="background-image:url('${t}')"`:""}>${t?"":`<span>פרק ${nx.n}</span>`}</div><div><b>${esc(epTitle(nx.s,nx.n)||"פרק "+nx.n)}</b><span>${esc(nx.s.title)} · פרק ${nx.n}</span></div></div>
      <div class="row-btns"><button class="btn btn-yellow un-now">${PLAYR}לצפות עכשיו</button><button class="btn btn-glass un-cancel">ביטול</button></div>
      <span class="un-sp">מוגש בחסות · ${SPONSOR.name}</span>
    </div>`;
  slide.appendChild(el);
  el.addEventListener("click",e=>e.stopPropagation());
  el.querySelector(".un-now").addEventListener("click",()=>goNext(nx));
  el.querySelector(".un-cancel").addEventListener("click",cancelUpNext);
  let left = UPNEXT_SECONDS; const num = el.querySelector(".un-ring b");
  player.upTimer = setInterval(()=>{ left--; if(left<=0) goNext(nx); else num.textContent = left; }, 1000);
}
function setEp(n){
  if(n!==player.ep) cancelUpNext();
  const s = byId(player.id); player.ep = n;
  $("#i-ep").textContent = `פרק ${n} מתוך ${s.eps}` + (epTitle(s,n)?` · ${epTitle(s,n)}`:"");
  $("#all-txt").textContent = `כל הפרקים · ${s.eps}`;
  $("#prog-b").style.width = "0%";
  const p = progress[s.id] || {ep:n,seen:[],t:0};
  p.ep=n; p.t=Date.now(); if(!p.seen.includes(n)) p.seen.push(n);
  progress[s.id]=p; store.set("ibs3_progress",progress);
  const k = s.id+":"+n;
  $("#b-like").classList.toggle("liked",!!liked[k]);
  $("#like-n").textContent = liked[k] ? "אהבתי" : "לייק";
  $("#b-save").classList.toggle("saved",myList.includes(s.id));
}
function closePlayer(){
  cancelUpNext();
  $("#feed").querySelectorAll("video").forEach(v=>v.pause());
  if(player.obs) player.obs.disconnect();
  $("#player").classList.remove("on"); document.body.style.overflow="";
  $("#feed").innerHTML="";
  renderHome(); if(!$("#v-list").hidden) renderList();
}

/* ===== אירועים ===== */
document.addEventListener("click",e=>{
  const t = e.target.closest("[data-play],[data-open],[data-go],[data-toggle-list]");
  if(!t) return;
  if(t.dataset.play){ const ep=+(t.dataset.ep||1);
    if($("#player").classList.contains("on") && player.id===t.dataset.play){ closeSheet(); $("#feed").scrollTop=(ep-1)*$("#feed").clientHeight; }
    else openPlayer(t.dataset.play, ep); return; }
  if(t.dataset.open){ openSheet(t.dataset.open); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.toggleList){ toggleList(t.dataset.toggleList); t.textContent = myList.includes(t.dataset.toggleList)?"ברשימה שלי":"לרשימה"; }
});
$("#scrim").addEventListener("click",closeSheet);
$("#bell").addEventListener("click",openNotifs);
$("#q").addEventListener("input",renderSearch);
$("#p-back").addEventListener("click",closePlayer);
$("#b-eps").addEventListener("click",()=>openSheet(player.id,true));
$("#b-all").addEventListener("click",()=>openSheet(player.id,true));
$("#b-save").addEventListener("click",()=>{ toggleList(player.id); $("#b-save").classList.toggle("saved",myList.includes(player.id)); });
$("#b-like").addEventListener("click",()=>{ const k=player.id+":"+player.ep; if(liked[k]) delete liked[k]; else liked[k]=1; store.set("ibs3_liked",liked); setEp(player.ep); });
$("#b-share").addEventListener("click",async()=>{
  const s=byId(player.id); const text=`${s.title} · פרק ${player.ep} בישראל בידור שורטס`;
  try{ if(navigator.share){ await navigator.share({title:s.title,text}); return; } await navigator.clipboard.writeText(text); toast("הועתק"); }catch(e){}
});
$("#i-line").addEventListener("click",()=>$("#i-line").classList.toggle("open"));
$("#feed").addEventListener("click",e=>{
  const sl=e.target.closest(".slide"); const v=sl&&sl.querySelector("video"); if(!v) return;
  if(v.paused){ v.play().catch(()=>{}); sl.querySelector(".paused").classList.remove("on"); }
  else { v.pause(); sl.querySelector(".paused").classList.add("on"); }
});
$("#prog").addEventListener("click",e=>{
  const v=$("#feed").querySelector(`.slide[data-ep="${player.ep}"] video`); if(!v||!v.duration) return;
  const r=e.currentTarget.getBoundingClientRect(); v.currentTime=((r.right-e.clientX)/r.width)*v.duration;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#sheet").classList.contains("on")) closeSheet(); else if($("#player").classList.contains("on")) closePlayer(); }
});
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1600); }

renderHome();
renderBell();

/* ===== אינטרו בכניסה לאפליקציה ===== */
(function(){
  const el = $("#intro");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.body.style.overflow = "hidden";
  let done = false;
  const finish = () => {
    if(done) return; done = true;
    el.classList.add("out");
    setTimeout(()=>{ el.classList.add("gone"); document.body.style.overflow=""; heroRestart(); }, reduce ? 320 : 400);
  };
  setTimeout(finish, reduce ? 700 : 1550);
  el.addEventListener("click", finish);
})();


</script>
